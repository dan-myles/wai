name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      - name: Build every platform
        run: task build
      - name: Check the release (version, changelog, all checks)
        run: task release:check VERSION="${GITHUB_REF_NAME#v}"
      - name: Smoke-test the binary
        run: apps/cli/dist/wai-linux-x64 version
      - name: Release notes from CHANGELOG.md
        run: awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md > notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/cli/dist/* --title "wai ${GITHUB_REF_NAME#v}" --notes-file notes.md
