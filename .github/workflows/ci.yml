name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # The build generates the embedded addon the CLI typechecks against.
      - name: Build the Linux binary
        run: task build TARGETS=bun-linux-x64
      - name: Check repository
        run: task ci
      - name: Smoke-test the binary
        run: apps/cli/dist/wai-linux-x64 version
